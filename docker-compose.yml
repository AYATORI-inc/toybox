version: '3.9'

services:
  web:
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - DEBUG=False
      - DB_HOST=db
      - DB_NAME=toybox
      - DB_USER=toybox_user
      - DB_PASSWORD=toybox_password
      - REDIS_URL=redis://redis:6379/0
      - ALLOWED_HOSTS=localhost,127.0.0.1,toybox.ayatori-inc.co.jp
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./backend:/app
      - static_volume:/app/staticfiles
      - media_volume:/app/public/uploads
    networks:
      - default
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/health/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  db:
    image: postgres:15-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: toybox
      POSTGRES_USER: toybox_user
      POSTGRES_PASSWORD: toybox_password
    volumes:
      - db_data:/var/lib/postgresql/data
    networks:
      - default
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U toybox_user"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    networks:
      - default
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
    command: celery -A toybox worker --loglevel=info
    restart: unless-stopped
    environment:
      - DEBUG=False
      - DB_HOST=db
      - DB_NAME=toybox
      - DB_USER=toybox_user
      - DB_PASSWORD=toybox_password
      - REDIS_URL=redis://redis:6379/0
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./backend:/app
      - media_volume:/app/public/uploads
    networks:
      - default

  beat:
    build:
      context: ./backend
      dockerfile: Dockerfile
    command: celery -A toybox beat --loglevel=info --scheduler django_celery_beat.schedulers:DatabaseScheduler
    restart: unless-stopped
    environment:
      - DEBUG=False
      - DB_HOST=db
      - DB_NAME=toybox
      - DB_USER=toybox_user
      - DB_PASSWORD=toybox_password
      - REDIS_URL=redis://redis:6379/0
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./backend:/app
    networks:
      - default

volumes:
  db_data:
  static_volume:
  media_volume:

networks:
  default:
    driver: bridge
