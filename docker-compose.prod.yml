version: '3.9'

services:
  caddy:
    build:
      context: ./caddy
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - caddy-data:/data
      - caddy-config:/config
      - static_volume:/app/staticfiles:ro
      - media_volume:/app/public/uploads:ro
    environment:
      - DOMAIN=toybox.ayatori-inc.co.jp
      - WEB_HOST=web:8000
    depends_on:
      - web
    networks:
      - default
    healthcheck:
      test: ["CMD", "caddy", "list", "routes"]
      interval: 30s
      timeout: 10s
      retries: 3

  web:
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      - DEBUG=False
      - DB_HOST=db
      - DB_NAME=toybox
      - DB_USER=toybox_user
      - DB_PASSWORD=toybox_password
      - REDIS_URL=redis://redis:6379/0
      - ALLOWED_HOSTS=toybox.ayatori-inc.co.jp,localhost
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - static_volume:/app/staticfiles
      - media_volume:/app/public/uploads
    networks:
      - default
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/health/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  db:
    image: postgres:15-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: toybox
      POSTGRES_USER: toybox_user
      POSTGRES_PASSWORD: toybox_password
    volumes:
      - db_data:/var/lib/postgresql/data
    networks:
      - default
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U toybox_user"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    networks:
      - default
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
    command: celery -A toybox worker --loglevel=info
    restart: unless-stopped
    environment:
      - DEBUG=False
      - DB_HOST=db
      - DB_NAME=toybox
      - DB_USER=toybox_user
      - DB_PASSWORD=toybox_password
      - REDIS_URL=redis://redis:6379/0
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - media_volume:/app/public/uploads
    networks:
      - default

  beat:
    build:
      context: ./backend
      dockerfile: Dockerfile
    command: celery -A toybox beat --loglevel=info --scheduler django_celery_beat.schedulers:DatabaseScheduler
    restart: unless-stopped
    environment:
      - DEBUG=False
      - DB_HOST=db
      - DB_NAME=toybox
      - DB_USER=toybox_user
      - DB_PASSWORD=toybox_password
      - REDIS_URL=redis://redis:6379/0
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - default

volumes:
  db_data:
  static_volume:
  media_volume:
  caddy-data:
  caddy-config:

networks:
  default:
    driver: bridge
